<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Hardi — Computer Science & Technology Portfolio">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#E8E8EC" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#wash)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <circle cx="960" cy="180" r="360" fill="url(#bloom)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <text x="96" y="286" font-size="96" font-weight="600" letter-spacing="-3" fill="#1D1D1F">Hardi</text>
    <text x="96" y="356" font-size="38" font-weight="500" letter-spacing="-0.5" fill="#6E6E73">Computer Science Graduate &amp; Tech Enthusiast</text>
    <text x="96" y="418" font-size="26" font-weight="400" fill="#86868B">Software Development &#183; Web Development &#183; Artificial Intelligence</text>
  </g>

  <rect x="96" y="470" width="64" height="4" rx="2" fill="#1D1D1F"/>
  <circle cx="182" cy="472" r="6" fill="#0071E3"/>
</svg>
