<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Sentiment analysis placeholder thumbnail">
  <defs>
    <pattern id="g4" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#E8E8EC" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="b4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="#F5F5F7"/>
  <rect width="1600" height="1000" fill="url(#g4)" opacity="0.6"/>
  <circle cx="900" cy="700" r="440" fill="url(#b4)"/>

  <!-- Text input panel -->
  <rect x="180" y="180" width="640" height="640" rx="28" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
  <g fill="#E9E9EF">
    <rect x="232" y="244" width="180" height="18" rx="9" fill="#E0E0E7"/>
    <rect x="232" y="316" width="536" height="16" rx="8"/>
    <rect x="232" y="356" width="470" height="16" rx="8"/>
    <rect x="232" y="396" width="512" height="16" rx="8"/>
    <rect x="232" y="436" width="352" height="16" rx="8"/>
  </g>
  <g fill="#E9E9EF">
    <rect x="232" y="516" width="488" height="16" rx="8"/>
    <rect x="232" y="556" width="536" height="16" rx="8"/>
    <rect x="232" y="596" width="404" height="16" rx="8"/>
  </g>
  <!-- Highlighted tokens -->
  <rect x="232" y="510" width="132" height="28" rx="10" fill="#0071E3" opacity="0.14"/>
  <rect x="454" y="550" width="108" height="28" rx="10" fill="#0071E3" opacity="0.14"/>
  <rect x="232" y="670" width="196" height="52" rx="26" fill="#1D1D1F"/>

  <!-- Score panel -->
  <rect x="880" y="180" width="540" height="640" rx="28" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
  <rect x="932" y="244" width="160" height="18" rx="9" fill="#E0E0E7"/>

  <!-- Sentiment bars -->
  <g>
    <rect x="932" y="330" width="436" height="26" rx="13" fill="#F0F0F4"/>
    <rect x="932" y="330" width="336" height="26" rx="13" fill="#0071E3" fill-opacity="0.55"/>
    <rect x="932" y="426" width="436" height="26" rx="13" fill="#F0F0F4"/>
    <rect x="932" y="426" width="148" height="26" rx="13" fill="#C4C4CC"/>
    <rect x="932" y="522" width="436" height="26" rx="13" fill="#F0F0F4"/>
    <rect x="932" y="522" width="80" height="26" rx="13" fill="#DCDCE3"/>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#86868B">
    <text x="932" y="312">Positive</text>
    <text x="932" y="408">Neutral</text>
    <text x="932" y="504">Negative</text>
  </g>

  <path d="M932 610h436" stroke="#EEEEF0" stroke-width="2"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#6E6E73">
    <text x="932" y="682" font-size="26" font-weight="500">Predicted label</text>
    <text x="932" y="730" font-size="40" font-weight="600" letter-spacing="-0.5" fill="#1D1D1F">Positive</text>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#86868B">
    <text x="180" y="906" font-size="34" font-weight="600" letter-spacing="-0.5" fill="#6E6E73">Sentiment Analysis</text>
    <text x="180" y="950" font-size="24" font-weight="400">Replace with a real chart or screenshot</text>
  </g>
